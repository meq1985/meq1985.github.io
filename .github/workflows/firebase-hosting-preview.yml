name: Firebase Hosting migration preview
on:
  push:
    branches: [firebase-hosting]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRESUPUESTO_ELECTRICO }}'
          channelId: migration
          expires: 7d
          projectId: presupuesto-electrico
