name: Validate application
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  billing:
    runs-on: ubuntu-latest
    env:
      GCLOUD_PROJECT: demo-presupuesto-electrico
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --prefix functions --ignore-scripts
      - run: npm test --prefix functions
      - run: npm audit --prefix functions --audit-level=low
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --prefix "$RUNNER_TEMP/firebase-cli" firebase-tools@15.34.0 --ignore-scripts
      - run: '"$RUNNER_TEMP/firebase-cli/node_modules/.bin/firebase" emulators:exec --project demo-presupuesto-electrico --config firebase.emulators.json --only firestore "node --test functions/emulator-test/billing.test.js"'
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --prefix "$RUNNER_TEMP/firebase-cli" firebase-tools@15.34.0 --ignore-scripts
      - run: '"$RUNNER_TEMP/firebase-cli/node_modules/.bin/firebase" emulators:exec --project demo-presupuesto-electrico --config firebase.emulators.json --only auth,firestore "npm run test:emulator"'
      - run: npm audit --audit-level=low
      - run: npm run build
